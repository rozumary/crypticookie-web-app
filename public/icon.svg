<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Shield Shape -->
  <path d="M256 96L384 152V264C384 344 329.3 416 256 432C182.7 416 128 344 128 264V152L256 96Z" fill="url(#shieldGrad)" stroke="#93c5fd" stroke-width="6"/>
  
  <!-- Inner Shield Highlight -->
  <path d="M256 120L360 166V260C360 326 315 387 256 404V120Z" fill="white" opacity="0.15"/>

  <!-- Blockchain Nodes & Cookie Motif inside shield -->
  <g transform="translate(196, 196)">
    <!-- Central Node (Lock/Cookie hybrid) -->
    <circle cx="60" cy="60" r="32" fill="#030712" stroke="#60a5fa" stroke-width="6"/>
    <circle cx="48" cy="52" r="5" fill="#38bdf8"/>
    <circle cx="72" cy="52" r="5" fill="#818cf8"/>
    <circle cx="60" cy="72" r="5" fill="#a78bfa"/>
    
    <!-- Orbiting Blockchain Connection Lines -->
    <path d="M60 28V-20" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    <path d="M88 44L125 25" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    <path d="M88 76L125 95" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 92V140" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    <path d="M32 76L-5 95" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    <path d="M32 44L-5 25" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>

    <!-- Outer Chain Blocks -->
    <rect x="48" y="-34" width="24" height="20" rx="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <rect x="120" y="15" width="24" height="20" rx="6" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
    <rect x="120" y="85" width="24" height="20" rx="6" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
    <rect x="48" y="135" width="24" height="20" rx="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <rect x="-24" y="85" width="24" height="20" rx="6" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
    <rect x="-24" y="15" width="24" height="20" rx="6" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
